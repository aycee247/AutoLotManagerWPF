name: Build

# First pass at CI for the solution (see issue #24).
#
# The solution mixes two project styles, which is why restore looks the way it does:
#   - AutoLotManager.Core / AutoLotManager.ViewModel: SDK-style, netstandard2.0, PackageReference
#   - AutoLotManager.Desktop:                        legacy csproj, net472, packages.config
#
# `msbuild -t:restore` only handles PackageReference, so it would silently skip the Desktop
# project's packages. The NuGet CLI restores both from a solution-level restore, so that is
# what runs below.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.configuration }}
    # WPF and .NET Framework need a Windows runner — this will not build on ubuntu.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v4

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          # Two locations, because the two project styles restore to different places:
          # packages.config lands in ./packages, PackageReference in the global cache.
          path: |
            ~/.nuget/packages
            packages
          # The configuration is part of the key so the Debug and Release matrix jobs do not
          # race to reserve the same cache entry (only one of them would win, and the loser
          # logged "Unable to reserve cache with key ..., another job may be creating this cache").
          key: ${{ runner.os }}-nuget-${{ matrix.configuration }}-${{ hashFiles('**/packages.config', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.configuration }}-
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        run: nuget restore AutoLotManager.sln

      # Platform is deliberately not passed. The solution platform is "Any CPU" while the
      # projects use "AnyCPU"; forcing /p:Platform at solution level trips that mismatch.
      - name: Build
        run: msbuild AutoLotManager.sln /p:Configuration=${{ matrix.configuration }} /m /nologo /v:minimal

      # vstest.console runs the already-built net472 assembly. `dotnet test` is not used
      # here: it would want to build the test project itself, and that pulls in the legacy
      # WPF Desktop project, which the dotnet CLI cannot build.
      - name: Test
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "**\TestPlatform\vstest.console.exe" |
            Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found via vswhere" }
          $assembly = "AutoLotManager.Tests\bin\${{ matrix.configuration }}\net472\AutoLotManager.Tests.dll"
          if (-not (Test-Path $assembly)) { throw "Test assembly not found at $assembly" }
          & $vstest $assembly
          exit $LASTEXITCODE

      - name: Upload build output
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: AutoLotManager-Desktop-Release
          path: AutoLotManager.Desktop/bin/Release/
          if-no-files-found: error
          retention-days: 14
