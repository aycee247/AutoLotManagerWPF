version: 2

updates:
  # Keeps the actions used by .github/workflows/build.yml current. Without this, action
  # majors drift until a runner deprecation (e.g. the Node 20 -> Node 24 move) forces a
  # manual sweep.
  #
  # No `labels:` key here on purpose: custom labels suppress the `dependencies` label
  # Dependabot creates by default, and Dependabot only applies custom labels that already
  # exist in the repo — this repo has none of them, so PRs would land unlabeled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # NuGet packages for the SDK-style projects only.
  #
  # AutoLotManager.Desktop is deliberately NOT covered. It is a legacy packages.config
  # project, and Dependabot's partial support for that format actively corrupts it. Of the
  # five PRs from the first run against it:
  #
  #   #51 Autofac      - correct, and green
  #   #52 Bogus        - BROKEN: bumped Bogus in packages.config, but also rewrote the csproj's
  #                      Autofac reference to 9.3.2 while leaving packages.config at 5.2.0. The
  #                      restore installs 5.2.0, the HintPath points at a Autofac.9.3.2 folder
  #                      that does not exist, and the build fails with
  #                      "CS0246: The type or namespace name 'Autofac' could not be found".
  #   #53 CommonServiceLocator - same failure mode
  #   #54 ControlzEx / #55 MahApps - the coupling deadlock described under `groups` below
  #
  # A dependency bot that desynchronises packages.config from the csproj produces PRs that
  # are worse than no PRs: one of them looked like a Bogus bump and was actually a broken
  # Autofac downgrade. Desktop packages are updated by hand until that project is migrated to
  # PackageReference, at which point this exclusion should be removed.
  - package-ecosystem: nuget
    directories:
      - /AutoLotManager.Core
      - /AutoLotManager.ViewModel
      - /AutoLotManager.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Version-locked families must be bumped together or not at all. Without groups
    # Dependabot opens one PR per package, and coupled packages then block each other
    # permanently. These patterns are kept even though the packages they name currently live
    # in the excluded Desktop project, so the rule is already in place when that project moves
    # to PackageReference. The deadlock they prevent, for the record: PR #55
    # (MahApps 2.1.1 -> 2.4.11) failed with
    #   error MC1000: Cannot resolve dependency to assembly
    #   'Microsoft.Windows.Design.Extensibility, Version=4.3.1.0'
    # because that assembly version comes from ControlzEx 4.3.1, which MahApps 2.4.11 has
    # outgrown — while PR #54 (ControlzEx 4.3.1 -> 7.0.4) failed from the other side, because
    # MahApps 2.1.1 requires ControlzEx 4.x. Neither could ever go green alone.
    groups:
      mahapps:
        patterns:
          - MahApps.Metro*
          - ControlzEx
      material-design:
        patterns:
          - MaterialDesign*
      syncfusion:
        # All Syncfusion packages share a single version stream (20.4.0.54 today); mixing
        # versions across them is not supported.
        patterns:
          - Syncfusion.*
      prism:
        patterns:
          - Prism.*
